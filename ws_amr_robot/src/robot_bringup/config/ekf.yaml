ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ========================================================================
    # SAKSI UTAMA (PRIORITAS TERTINGGI): ODOMETRI LASER (RF2O)
    # ========================================================================
    odom0: /odom_rf2o
    # REVISI ABSOLUT: 
    # Mengaktifkan X, Y, Yaw (Posisi) DAN Vx, Vy, VYaw (Kecepatan).
    # Jika roda selip (Vx Roda = 0.5), RF2O akan membantahnya (Vx RF2O = 0.0).
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # ========================================================================
    # SAKSI CADANGAN (REDUNDANSI): ODOMETRI RODA (ENCODER)
    # ========================================================================
    odom1: /odom_raw
    # Tetap membiarkan roda melaporkan Vx dan VYaw sebagai penyokong, 
    # namun kini kesaksiannya akan diadu langsung dengan kesaksian kecepatan RF2O.
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false

    # ========================================================================
    # SAKSI INERSIA: IMU
    # ========================================================================
    imu0: /imu/data_raw
    # IMU tetap menjadi hakim tertinggi untuk rotasi mendadak (VYaw).
    imu0_config: [false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    imu0_remove_gravitational_acceleration: true
