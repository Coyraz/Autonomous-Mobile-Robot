slam_toolbox:
  ros__parameters:
    # Plugin Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_restamped
    mode: mapping

    # --- Lidar Physical Constraints (PEMBATASAN CPU) ---
    max_laser_range: 12.0 # Batasi beban matematis pada jarak fisik sensor
    minimum_time_interval: 0.2 # Jangan proses data lebih cepat dari 5Hz untuk menghemat CPU

    # Timing & Buffer
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Map Settings
    map_resolution: 0.02
    map_publish_period: 2.0

    # Scan Matching
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_subscriber_queue_size: 10
    link_match_minimum_response_fine: 0.45
    link_scan_maximum_distance: 0.5
    # TRIAL 2026-07-21: loosened 1.5->1.8 to test if it reduces along-corridor
    # drift (aisles are 2.5m apart, so 1.8m still leaves ~0.7m safety margin
    # before risking a false loop-closure into the neighboring identical
    # corridor). Response thresholds tightened to compensate (see test13.md).
    # REVERT to 1.5 / 0.55 / 0.65 if this attempt fails or corrupts the map.
    loop_search_maximum_distance: 1.8
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 1.5
    loop_match_minimum_response_coarse: 0.65
    loop_match_minimum_response_fine: 0.75

    # Performance
    throttle_scans: 2
